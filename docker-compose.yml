name: currency-converter

services:
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  db:
    image: postgres:17.10-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-currency_converter}
      POSTGRES_USER: ${POSTGRES_USER:-currency_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-currency_local_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-currency_app} -d ${POSTGRES_DB:-currency_converter}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=${POSTGRES_DB:-currency_converter};Username=${POSTGRES_USER:-currency_app};Password=${POSTGRES_PASSWORD:-currency_local_2026}"
      RateService__BaseUrl: http://web-service:8080/
    depends_on:
      db:
        condition: service_healthy
      web-service:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8081}:8080"

  web-service:
    build: ./web-service
    ports:
      - "${WEB_SERVICE_PORT:-8082}:8080"

volumes:
  postgres_data:
